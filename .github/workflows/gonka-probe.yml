name: Ultra-Verbose Top-3 Validation (GLM-5.3-Flash) — dual agent

on:
  workflow_dispatch:
    inputs:
      max_budget_usd:
        description: "Per-task dollar budget"
        required: false
        default: "4.0"
      timeout_seconds:
        description: "Per-task timeout (seconds)"
        required: false
        default: "9000"

jobs:
  ultra-verbose-top3:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      # Same Gonka key exposed under both names
      OPENAI_API_KEY: ${{ secrets.GONKA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.GONKA_API_KEY }}
      OPENAI_BASE_URL: "https://api.gonkarouter.io/v1"
      ANTHROPIC_BASE_URL: "https://api.gonkarouter.io"
      MODEL: "zai-org/GLM-5.3-Flash"
      OPENAI_LOG: "debug"
      PYTHONUNBUFFERED: "1"
      PYTHONLOGLEVEL: "DEBUG"
      UV_LOG: "debug"
      DOCKER_BUILDKIT: "1"

    steps:
      - name: 0. System info
        run: |
          set -x
          date -u
          uname -a
          free -h
          df -h
          nproc
          docker version || true

      - name: 1. Checkout ExploitGym
        uses: actions/checkout@v4
        with:
          repository: sunblaze-ucb/exploitgym
          path: exploitgym

      - name: 2. Set up Python + uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 3. Install dependencies
        working-directory: exploitgym
        run: |
          set -x
          uv sync --extra proxy -v
          uv pip install openai anthropic -v
          uv pip list

      - name: 4. Create top-3 task list
        working-directory: exploitgym
        run: |
          mkdir -p data/task_ids
          cat > data/task_ids/top3_easy.txt << 'EOF'
          user:cybergym/arvo_44034
          user:cybergym/arvo_66627
          user:cybergym/arvo_50683
          EOF
          cat -n data/task_ids/top3_easy.txt

      - name: 5. Pull Docker images
        working-directory: exploitgym
        run: |
          set -x
          uv run -v scripts/setup/pull_images.py data/task_ids/top3_easy.txt --user-modes exp.none 2>&1 | tee /tmp/pull_images.log || true
          docker images
          tail -n 80 /tmp/pull_images.log || true

      - name: 6. Runtime artifacts
        working-directory: exploitgym
        run: |
          set -x
          bash -x scripts/setup/setup_data.sh 2>&1 | tee /tmp/setup_data.log || true
          docker pull ubuntu/squid:latest 2>&1 | tee /tmp/squid.log || true

      - name: 7. Start controller / proxy (mint secrets)
        working-directory: exploitgym
        run: |
          set -x
          SALT="cg-$(openssl rand -hex 16)"
          FLAG_SEED="sf-$(openssl rand -hex 16)"
          API_KEY="cybergym-$(openssl rand -hex 16)"

          echo "CYBERGYM_SERVER_SALT=$SALT"           >> $GITHUB_ENV
          echo "CYBERGYM_SERVER_FLAG_SEED=$FLAG_SEED" >> $GITHUB_ENV
          echo "CYBERGYM_SERVER_API_KEY=$API_KEY"     >> $GITHUB_ENV

          export CYBERGYM_SERVER_SALT="$SALT"
          export CYBERGYM_SERVER_FLAG_SEED="$FLAG_SEED"
          export CYBERGYM_SERVER_API_KEY="$API_KEY"

          echo "===== MINTED SECRETS ====="
          echo "CYBERGYM_SERVER_SALT=$SALT"
          echo "CYBERGYM_SERVER_FLAG_SEED=$FLAG_SEED"
          echo "CYBERGYM_SERVER_API_KEY=$API_KEY"

          uv run -v scripts/setup/pre_run.py data/task_ids/top3_easy.txt 2>&1 | tee /tmp/pre_run.log || true
          echo "===== PRE_RUN LOG (tail) ====="
          tail -n 100 /tmp/pre_run.log || true

      # ---------- Agent A: claude_code (Anthropic-style) ----------
      - name: 8a. Run agent = claude_code
        working-directory: exploitgym
        run: |
          set -x
          mkdir -p out/claude_code
          echo "===== CLAUDE_CODE RUN ====="
          echo "ANTHROPIC_API_KEY set? ${ANTHROPIC_API_KEY:+yes}"
          echo "ANTHROPIC_BASE_URL=$ANTHROPIC_BASE_URL"
          echo "MODEL=$MODEL"

          uv run -v examples/run_agent.py \
            --agent claude_code \
            --model "$MODEL" \
            --tasks-file data/task_ids/top3_easy.txt \
            --max-workers 1 \
            --timeout ${{ github.event.inputs.timeout_seconds || 9000 }} \
            --budget ${{ github.event.inputs.max_budget_usd || 4.0 }} \
            --out-dir out/claude_code \
            --user-mode exp.none \
            --use-api-key \
            2>&1 | tee out/claude_code/FULL_CONSOLE.log /tmp/claude_code_console.log

          echo "===== CLAUDE_CODE FINISHED (exit=${PIPESTATUS[0]}) ====="
          find out/claude_code -type f -printf "%s\t%p\n" | sort -n || true

      # ---------- Agent B: codex (OpenAI-style) ----------
      - name: 8b. Run agent = codex
        working-directory: exploitgym
        run: |
          set -x
          mkdir -p out/codex
          echo "===== CODEX RUN ====="
          echo "OPENAI_API_KEY set? ${OPENAI_API_KEY:+yes}"
          echo "OPENAI_BASE_URL=$OPENAI_BASE_URL"
          echo "MODEL=$MODEL"

          uv run -v examples/run_agent.py \
            --agent codex \
            --model "$MODEL" \
            --tasks-file data/task_ids/top3_easy.txt \
            --max-workers 1 \
            --timeout ${{ github.event.inputs.timeout_seconds || 9000 }} \
            --budget ${{ github.event.inputs.max_budget_usd || 4.0 }} \
            --out-dir out/codex \
            --user-mode exp.none \
            --use-api-key \
            2>&1 | tee out/codex/FULL_CONSOLE.log /tmp/codex_console.log

          echo "===== CODEX FINISHED (exit=${PIPESTATUS[0]}) ====="
          find out/codex -type f -printf "%s\t%p\n" | sort -n || true

      - name: 9. Compare results
        working-directory: exploitgym
        if: always()
        run: |
          set -x
          echo "############################################################"
          echo "##### COMPARISON SUMMARY"
          echo "############################################################"

          for agent in claude_code codex; do
            echo ""
            echo "===== $agent ====="
            OUT=out/$agent
            echo "Files:"
            find "$OUT" -type f -printf "%p (%s bytes)\n" 2>/dev/null | sort || true
            echo "result.json files:"
            find "$OUT" -name 'result.json' 2>/dev/null | while read f; do
              echo "--- $f ---"
              cat "$f"
              if jq -e '.score > 0' "$f" >/dev/null 2>&1; then
                echo "✅ SOLVED"
              else
                echo "❌ NOT SOLVED"
              fi
            done || echo "(no result.json)"
            echo "Last 40 lines of console:"
            tail -n 40 "$OUT/FULL_CONSOLE.log" 2>/dev/null || true
          done

          echo ""
          echo "===== QUICK ERROR GREP ====="
          grep -n -iE 'error|ValueError|auth|401|403|invalid|failed' \
            out/claude_code/FULL_CONSOLE.log out/codex/FULL_CONSOLE.log \
            /tmp/claude_code_console.log /tmp/codex_console.log 2>/dev/null | head -80 || true

      - name: 10. Upload everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top3-dual-agent-logs
          path: |
            exploitgym/out/
            /tmp/*.log
          retention-days: 14
