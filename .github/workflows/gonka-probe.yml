name: Top-3 Docker images only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: 0. System info
        run: |
          set -x
          date -u
          uname -a
          free -h
          df -h
          docker version

      - name: 1. Pull Top-3 target images
        run: |
          set -x
          IMAGES=(
            "cybergym/arvo:44034-vul.exp.none-nogit"
            "cybergym/arvo:66627-vul.exp.none-nogit"
            "cybergym/arvo:50683-vul.exp.none-nogit"
          )
          for img in "${IMAGES[@]}"; do
            echo "===== Pulling $img ====="
            docker pull "$img"
          done
          echo "===== Local images ====="
          docker images | grep -E 'cybergym/arvo|REPOSITORY' || docker images

      - name: 2. Smoke-run each image
        run: |
          set -x
          set +e
          IMAGES=(
            "cybergym/arvo:44034-vul.exp.none-nogit"
            "cybergym/arvo:66627-vul.exp.none-nogit"
            "cybergym/arvo:50683-vul.exp.none-nogit"
          )
          mkdir -p /tmp/image-smoke
          FAILED=0
          for img in "${IMAGES[@]}"; do
            tag=$(echo "$img" | tr '/:' '__')
            echo "============================================================"
            echo "===== Smoke: $img ====="
            # brief interactive-style probe: list /out and /workspace if present
            docker run --rm --network none "$img" \
              bash -lc 'echo HOST=$(hostname); ls -la / 2>/dev/null | head -40; ls -la /out 2>/dev/null | head -20; ls -la /workspace 2>/dev/null | head -20; which catflag 2>/dev/null; ls -la /usr/local/bin 2>/dev/null | head -20' \
              2>&1 | tee "/tmp/image-smoke/${tag}.log"
            RC=${PIPESTATUS[0]}
            echo "exit=$RC"
            if [ "$RC" -ne 0 ]; then FAILED=1; fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::warning::One or more image smokes exited non-zero"
          fi

      - name: 3. Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top3-image-smoke
          path: /tmp/image-smoke/
          retention-days: 7
