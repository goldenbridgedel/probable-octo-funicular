name: Ultra-Verbose Top-3 Validation (GLM-5.3-Flash) — OpenAI style

on:
  workflow_dispatch:
    inputs:
      max_budget_usd:
        description: "Per-task dollar budget"
        required: false
        default: "4.0"
      timeout_seconds:
        description: "Per-task timeout (seconds)"
        required: false
        default: "9000"

permissions:
  contents: write

jobs:
  ultra-verbose-top3:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      OPENAI_API_KEY: ${{ secrets.GONKA_API_KEY }}
      OPENAI_BASE_URL: "https://api.gonkarouter.io/v1"
      MODEL: "zai-org/GLM-5.3-Flash"
      OPENAI_LOG: "debug"
      PYTHONUNBUFFERED: "1"
      PYTHONLOGLEVEL: "DEBUG"
      UV_LOG: "debug"
      DOCKER_BUILDKIT: "1"

    steps:
      - name: 0. System info
        run: |
          set -x
          date -u
          uname -a
          free -h
          df -h
          docker version || true

      - name: 1. Checkout this repo (for pushing logs)
        uses: actions/checkout@v4
        with:
          path: probe-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 1b. Checkout ExploitGym
        uses: actions/checkout@v4
        with:
          repository: sunblaze-ucb/exploitgym
          path: exploitgym

      - name: 2. Set up Python + uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -x
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv --version

      - name: 3. Install Python deps
        working-directory: exploitgym
        run: |
          set -x
          uv sync --extra proxy -v
          uv pip install openai -v

      - name: 4. Create top-3 task list
        working-directory: exploitgym
        run: |
          mkdir -p data/task_ids
          cat > data/task_ids/top3_easy.txt << 'EOF'
          user:cybergym/arvo_44034
          user:cybergym/arvo_66627
          user:cybergym/arvo_50683
          EOF
          cat -n data/task_ids/top3_easy.txt

      - name: 5. Pull Docker images
        working-directory: exploitgym
        run: |
          set -x
          uv run -v scripts/setup/pull_images.py data/task_ids/top3_easy.txt --user-modes exp.none 2>&1 | tee /tmp/pull_images.log || true
          docker images

      - name: 6. Runtime artifacts (gdb / socat / nc)
        working-directory: exploitgym
        run: |
          set -x
          bash -x scripts/setup/setup_data.sh 2>&1 | tee /tmp/setup_data.log || true
          docker pull ubuntu/squid:latest 2>&1 | tee /tmp/squid.log || true

      - name: 6b. Install Node + Codex into data/runtime/node (fixed launcher)
        working-directory: exploitgym
        run: |
          set -x
          NODE_PREFIX="$(pwd)/data/runtime/node"
          mkdir -p "$NODE_PREFIX"

          if [[ ! -x "$NODE_PREFIX/bin/node" ]]; then
            NODE_VERSION="22.21.0"
            echo "Downloading Node ${NODE_VERSION}..."
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
              -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /tmp
            cp -a /tmp/node-v${NODE_VERSION}-linux-x64/. "$NODE_PREFIX/"
          fi

          echo "Node at: $NODE_PREFIX/bin/node"
          "$NODE_PREFIX/bin/node" -v
          "$NODE_PREFIX/bin/npm" -v

          echo "Installing @openai/codex..."
          NPM_CONFIG_PREFIX="$NODE_PREFIX" npm_config_prefix="$NODE_PREFIX" \
            "$NODE_PREFIX/bin/npm" install -g --prefix "$NODE_PREFIX" "@openai/codex@0.120.0"

          # CRITICAL: never rely on `env node` — container has no node on PATH.
          # Always exec via $SCRIPT_DIR/node (mounted at /data/node/bin/node).
          cat > "$NODE_PREFIX/bin/codex.sh" << 'LAUNCHER'
          #!/bin/bash
          SCRIPT_DIR=$(readlink -f "$(dirname "${BASH_SOURCE[0]}")")
          NODE="$SCRIPT_DIR/node"
          export PATH="$SCRIPT_DIR:$PATH"

          if [[ ! -x "$NODE" ]]; then
            echo "node missing at $NODE" >&2
            exit 127
          fi

          # Prefer adjacent codex binary/script
          if [[ -e "$SCRIPT_DIR/codex" && ! -d "$SCRIPT_DIR/codex" ]]; then
            if head -c 2 "$SCRIPT_DIR/codex" 2>/dev/null | grep -q '#!'; then
              exec "$NODE" "$SCRIPT_DIR/codex" "$@"
            fi
            if [[ -x "$SCRIPT_DIR/codex" ]]; then
              exec "$SCRIPT_DIR/codex" "$@"
            fi
          fi

          # npm package entrypoints
          for cand in \
            "$SCRIPT_DIR/../lib/node_modules/@openai/codex/bin/codex.js" \
            "$SCRIPT_DIR/../lib/node_modules/@openai/codex/bin/codex" \
            "$SCRIPT_DIR/../lib/node_modules/@openai/codex/dist/cli.js"
          do
            if [[ -f "$cand" ]]; then
              exec "$NODE" "$cand" "$@"
            fi
          done

          echo "codex entry not found under $SCRIPT_DIR" >&2
          ls -la "$SCRIPT_DIR" >&2
          ls -la "$SCRIPT_DIR/../lib/node_modules/@openai/codex" 2>/dev/null | head -40 >&2 || true
          exit 127
          LAUNCHER
          chmod +x "$NODE_PREFIX/bin/codex.sh"

          # Strip any CRLF that could break shebang in container
          sed -i 's/\r$//' "$NODE_PREFIX/bin/codex.sh"

          echo "===== HOST VALIDATE ====="
          ls -la "$NODE_PREFIX/bin/" | head -40
          "$NODE_PREFIX/bin/codex.sh" --version 2>&1 | head -30 || true

          echo "===== CONTAINER VALIDATE (same mount layout as eval) ====="
          docker run --rm \
            -v "$(pwd)/data/runtime:/data:ro" \
            ubuntu:22.04 \
            /data/node/bin/codex.sh --version 2>&1 | tee /tmp/codex_in_container.log
          grep -qiE 'No such file|env: .node.|not found' /tmp/codex_in_container.log && {
            echo "CONTAINER CODEX STILL BROKEN"
            cat /tmp/codex_in_container.log
            exit 1
          }
          echo "Container codex OK"

      - name: 7. Start controller / proxy (mint secrets)
        working-directory: exploitgym
        run: |
          set -x
          SALT="cg-$(openssl rand -hex 16)"
          FLAG_SEED="sf-$(openssl rand -hex 16)"
          API_KEY="cybergym-$(openssl rand -hex 16)"
          echo "CYBERGYM_SERVER_SALT=$SALT"           >> $GITHUB_ENV
          echo "CYBERGYM_SERVER_FLAG_SEED=$FLAG_SEED" >> $GITHUB_ENV
          echo "CYBERGYM_SERVER_API_KEY=$API_KEY"     >> $GITHUB_ENV
          export CYBERGYM_SERVER_SALT="$SALT"
          export CYBERGYM_SERVER_FLAG_SEED="$FLAG_SEED"
          export CYBERGYM_SERVER_API_KEY="$API_KEY"

          uv run -v scripts/setup/pre_run.py data/task_ids/top3_easy.txt 2>&1 | tee /tmp/pre_run.log || true
          tail -n 80 /tmp/pre_run.log || true
          docker ps -a || true

      - name: 8. Run agent = codex (OpenAI style)
        working-directory: exploitgym
        run: |
          set -x
          mkdir -p out/codex
          echo "OPENAI_API_KEY set? ${OPENAI_API_KEY:+yes}"
          echo "OPENAI_BASE_URL=$OPENAI_BASE_URL"
          echo "MODEL=$MODEL"
          ls -la data/runtime/node/bin/codex.sh data/runtime/node/bin/node

          .venv/bin/python - <<'PY' 2>&1 | tee /tmp/gonka_smoke.log || true
          import os
          from openai import OpenAI
          c = OpenAI(api_key=os.environ["OPENAI_API_KEY"], base_url=os.environ["OPENAI_BASE_URL"])
          print("models", [m.id for m in c.models.list().data[:5]])
          r = c.chat.completions.create(model=os.environ["MODEL"], messages=[{"role":"user","content":"pong"}], max_tokens=16)
          print("chat", r.choices[0].message.content)
          PY

          uv run -v examples/run_agent.py \
            --agent codex \
            --model "$MODEL" \
            --tasks-file data/task_ids/top3_easy.txt \
            --max-workers 1 \
            --timeout ${{ github.event.inputs.timeout_seconds || 9000 }} \
            --budget ${{ github.event.inputs.max_budget_usd || 4.0 }} \
            --out-dir out/codex \
            --user-mode exp.none \
            --use-api-key \
            2>&1 | tee out/codex/FULL_CONSOLE.log /tmp/codex_console.log

          echo "exit=${PIPESTATUS[0]}"
          find out/codex -type f -printf "%s\t%p\n" | sort -n | tail -50

      - name: 9. Dump results
        working-directory: exploitgym
        if: always()
        run: |
          set -x
          OUT=out/codex
          find "$OUT" -name 'result.json' | while read f; do
            echo "=== $f ==="
            cat "$f"
            jq -e '.score > 0' "$f" >/dev/null 2>&1 && echo SOLVED || echo NOT_SOLVED
          done || true
          echo "===== codex.log samples ====="
          find "$OUT" -name 'codex.log' | while read f; do
            echo "--- $f ---"
            head -n 80 "$f"
          done || true
          tail -n 120 "$OUT/FULL_CONSOLE.log" 2>/dev/null || true
          grep -n -iE 'error|No such file|env: .node.|codex.sh|401|403|ValueError' \
            "$OUT/FULL_CONSOLE.log" /tmp/codex_console.log /tmp/codex_in_container.log 2>/dev/null | head -50 || true

      - name: 10. Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top3-codex-openai-logs
          path: |
            exploitgym/out/codex/
            exploitgym/data/runtime/node/bin/
            /tmp/*.log
          retention-days: 14

      - name: 11. Push logs to repo
        if: always()
        working-directory: probe-repo
        run: |
          set -x
          RUN_ID="${{ github.run_id }}"
          BRANCH="run-logs/${RUN_ID}"
          DEST="logs/${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "$DEST"
          cp -a ../exploitgym/out/codex/. "$DEST/" 2>/dev/null || true
          cp -a /tmp/*.log "$DEST/" 2>/dev/null || true
          {
            echo "# Run ${RUN_ID}"
            echo "- UTC: $(date -u)"
            echo "## results"
            find "$DEST" -name result.json | while read f; do
              echo "### $f"
              echo '```json'
              cat "$f"
              echo '```'
            done
          } > "$DEST/README.md"
          git checkout -B "$BRANCH"
          git add -A
          git diff --staged --quiet || git commit -m "logs: run ${RUN_ID} (codex node PATH fix)"
          git push -u origin "$BRANCH" --force
          echo "https://github.com/${{ github.repository }}/tree/${BRANCH}"
