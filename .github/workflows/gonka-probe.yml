name: Flag Probe (real containers + extreme verbosity)

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "Per-task timeout (seconds)"
        required: false
        default: "2400"
      max_budget_usd:
        description: "Per-task dollar budget"
        required: false
        default: "5.0"
      reasoning_effort:
        description: "Codex reasoning effort"
        required: false
        default: "high"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENAI_API_KEY: ${{ secrets.GONKA_API_KEY }}
      OPENAI_BASE_URL: "https://api.gonkarouter.io/v1"
      MODEL: "zai-org/GLM-5.3-Flash"
      OPENAI_LOG: "debug"
      PYTHONUNBUFFERED: "1"
      PYTHONLOGLEVEL: "DEBUG"
      UV_LOG: "debug"
      CODEX_NPM_VERSION: "0.80.0"
      CODEX_LOG_LEVEL: "debug"
      OPENAI_LOG_LEVEL: "debug"

    steps:
      - name: 0. System info (ultra-verbose)
        run: |
          set -x
          echo "############################################################"
          echo "##### 0. SYSTEM INFO ######################################"
          echo "############################################################"
          date -u
          echo "--- uname ---"
          uname -a
          echo "--- memory ---"
          free -h
          echo "--- disk ---"
          df -h
          echo "--- cpu ---"
          nproc
          lscpu | head -20 || true
          echo "--- os-release ---"
          cat /etc/os-release || true
          echo "--- docker ---"
          docker version || true
          docker info 2>&1 | head -40 || true
          echo "--- selected env ---"
          env | grep -E 'OPENAI|MODEL|CODEX|UV_|GITHUB_|CYBERGYM_|RUNNER_' | sort
          echo "##### END 0 #####"

      - name: 1. Checkout this repo
        uses: actions/checkout@v4
        with:
          path: probe-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 1b. Checkout ExploitGym
        uses: actions/checkout@v4
        with:
          repository: sunblaze-ucb/exploitgym
          path: exploitgym

      - name: 2. Python 3.12 + uv + project install
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 2b. Install uv + sync (verbose)
        working-directory: exploitgym
        run: |
          set -x
          echo "############################################################"
          echo "##### 2b. UV + PROJECT INSTALL ############################"
          echo "############################################################"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          which uv
          uv --version
          python3 --version
          which python3
          echo "--- running uv sync --extra proxy ---"
          uv sync --extra proxy
          echo "--- installed packages ---"
          uv pip list
          echo "--- verifying import ---"
          uv run python -c "
          import cybergym, sys
          print('cybergym OK')
          print('file:', cybergym.__file__)
          print('python:', sys.version)
          "
          echo "##### END 2b #####"

      - name: 3. Node + Codex (verbose)
        run: |
          set -x
          echo "############################################################"
          echo "##### 3. NODE + CODEX #####################################"
          echo "############################################################"
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
          echo "--- installing codex ${CODEX_NPM_VERSION} ---"
          npm install -g @openai/codex@${CODEX_NPM_VERSION}
          which codex
          codex --version || true
          echo "##### END 3 #####"

      - name: 4. Runtime tools + force ASLR off (verbose)
        run: |
          set -x
          echo "############################################################"
          echo "##### 4. ASLR + RUNTIME TOOLS #############################"
          echo "############################################################"
          echo "--- before ASLR ---"
          cat /proc/sys/kernel/randomize_va_space || true
          echo 0 | sudo tee /proc/sys/kernel/randomize_va_space
          sudo sysctl -w kernel.randomize_va_space=0 || true
          echo "--- after ASLR ---"
          cat /proc/sys/kernel/randomize_va_space
          sysctl kernel.randomize_va_space || true
          echo "--- installing gdb / socat / nc ---"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb socat netcat-openbsd
          which gdb socat nc
          gdb --version | head -1 || true
          echo "##### END 4 #####"

      - name: 5. Task list (verbose)
        run: |
          set -x
          echo "############################################################"
          echo "##### 5. TASK LIST ########################################"
          echo "############################################################"
          mkdir -p /tmp/tasks
          cat > /tmp/tasks/list.txt << 'EOF'
          user:cybergym/arvo_18224
          user:cybergym/arvo_1699
          user:cybergym/arvo_25885
          EOF
          echo "--- task list content ---"
          cat -A /tmp/tasks/list.txt
          echo "--- wc ---"
          wc -l /tmp/tasks/list.txt
          echo "##### END 5 #####"

      - name: 6. Pull images + data (verbose)
        working-directory: exploitgym
        run: |
          set -x
          echo "############################################################"
          echo "##### 6. PULL IMAGES + DATA ###############################"
          echo "############################################################"
          echo "--- pulling ubuntu/squid:latest ---"
          docker pull ubuntu/squid:latest
          echo "--- running setup_data.sh ---"
          bash scripts/setup/setup_data.sh || echo "setup_data.sh returned non-zero (continuing)"
          echo "--- running pull_images.py ---"
          uv run scripts/setup/pull_images.py /tmp/tasks/list.txt
          echo "--- docker images (top 40) ---"
          docker images | head -40
          echo "--- disk after pulls ---"
          df -h
          echo "##### END 6 #####"

      - name: 7. Start controller via pre_run (extreme verbosity)
        working-directory: exploitgym
        run: |
          set -x
          echo "############################################################"
          echo "##### 7. PRE_RUN + CONTROLLER #############################"
          echo "############################################################"
          echo "--- ASLR check before pre_run ---"
          cat /proc/sys/kernel/randomize_va_space
          echo "--- task list being passed ---"
          cat /tmp/tasks/list.txt

          set +e
          echo "--- launching pre_run.py (full output) ---"
          uv run scripts/setup/pre_run.py /tmp/tasks/list.txt --no-llm-proxy 2>&1 | tee /tmp/pre_run.log
          PRE_RC=${PIPESTATUS[0]}
          set -e

          echo "============================================================"
          echo "pre_run exit code: $PRE_RC"
          echo "============================================================"
          echo "===== FULL pre_run.log ====="
          cat /tmp/pre_run.log
          echo "===== END pre_run.log ====="

          echo "--- extracting secrets ---"
          grep -E 'export CYBERGYM_SERVER_(SALT|FLAG_SEED|API_KEY)=' /tmp/pre_run.log > /tmp/secrets.sh || true
          echo "--- secrets.sh content ---"
          cat /tmp/secrets.sh || echo "(no secrets captured)"
          if [[ -f /tmp/secrets.sh ]]; then
            source /tmp/secrets.sh
          fi
          echo "SALT set?        ${CYBERGYM_SERVER_SALT:+YES}"
          echo "FLAG_SEED set?   ${CYBERGYM_SERVER_FLAG_SEED:+YES}"
          echo "API_KEY set?     ${CYBERGYM_SERVER_API_KEY:+YES}"

          echo "--- waiting for controller on :8666 ---"
          for i in $(seq 1 30); do
            echo "health check attempt $i ..."
            if curl -sf -v http://127.0.0.1:8666/ 2>&1 | tee /tmp/curl_8666.log; then
              echo "Controller is UP on attempt $i"
              cat /tmp/curl_8666.log
              exit 0
            fi
            echo "not ready yet"
            sleep 2
          done

          echo "############################################################"
          echo "CONTROLLER NEVER CAME UP"
          echo "############################################################"
          echo "--- last 200 lines of pre_run.log ---"
          tail -200 /tmp/pre_run.log || true
          echo "--- listening ports ---"
          ss -tlnp || netstat -tlnp || true
          echo "--- docker ps ---"
          docker ps -a || true
          exit 1

      - name: 8. Run agent on real containers (ultra-verbose LLM I/O)
        working-directory: exploitgym
        run: |
          set -x
          set +e

          echo "############################################################"
          echo "##### 8. AGENT RUNS (REAL CONTAINERS) #####################"
          echo "############################################################"

          if [[ -f /tmp/secrets.sh ]]; then
            echo "--- sourcing secrets ---"
            source /tmp/secrets.sh
          fi
          echo "SALT=${CYBERGYM_SERVER_SALT:-(unset)}"
          echo "FLAG_SEED=${CYBERGYM_SERVER_FLAG_SEED:-(unset)}"
          echo "API_KEY=${CYBERGYM_SERVER_API_KEY:-(unset)}"

          TIMEOUT=${{ github.event.inputs.timeout_seconds || '2400' }}
          BUDGET=${{ github.event.inputs.max_budget_usd || '5.0' }}
          REASONING=${{ github.event.inputs.reasoning_effort || 'high' }}

          echo "TIMEOUT=$TIMEOUT  BUDGET=$BUDGET  REASONING=$REASONING  MODEL=$MODEL"

          mkdir -p /tmp/results
          TASK_NUM=0
          TOTAL_SOLVED=0

          while read -r TASK; do
            [[ -z "$TASK" ]] && continue
            TASK_NUM=$((TASK_NUM + 1))
            SAFE=$(echo "$TASK" | tr '/:' '__')
            OUT="/tmp/results/${SAFE}"
            mkdir -p "$OUT"

            echo ""
            echo "############################################################"
            echo "##### TASK $TASK_NUM: $TASK"
            echo "############################################################"
            echo "OUT_DIR=$OUT"
            date -u

            echo "--- launching run_agent.py ---"
            uv run examples/run_agent.py \
              --task "$TASK" \
              --model "$MODEL" \
              --timeout "$TIMEOUT" \
              --budget "$BUDGET" \
              --reasoning-effort "$REASONING" \
              --out-dir "$OUT" \
              2>&1 | tee "$OUT/console.log"

            AGENT_RC=${PIPESTATUS[0]}
            echo "Agent exit code: $AGENT_RC"
            date -u

            echo "----- directory tree of $OUT -----"
            find "$OUT" -type f 2>/dev/null | sort || true

            echo "----- FULL LLM I/O DUMP for $TASK -----"
            find "$OUT" -type f \( \
              -name '*.log' -o -name '*prompt*' -o -name '*codex*' \
              -o -name '*conversation*' -o -name '*messages*' \
              -o -name '*.jsonl' -o -name 'config.toml' -o -name '*.json' \
            \) 2>/dev/null | sort | while read f; do
              echo ""
              echo "#################### FILE: $f ####################"
              ls -la "$f" || true
              wc -l "$f" || true
              echo "----- content (first 500KB) -----"
              head -c 500000 "$f" || true
              echo ""
              echo "#################### END $f ####################"
            done

            echo "----- FLAG CHECK for $TASK -----"
            if find "$OUT" -name flag.txt -size +0 2>/dev/null | grep -q .; then
              echo "***** FLAG FOUND *****"
              find "$OUT" -name flag.txt -size +0 -exec ls -la {} \; -exec cat {} \;
              TOTAL_SOLVED=$((TOTAL_SOLVED + 1))
            else
              echo "***** NO FLAG *****"
              find "$OUT" -name 'flag*' 2>/dev/null || true
            fi

            echo "##### END TASK $TASK_NUM #####"
            sleep 3
          done < /tmp/tasks/list.txt

          echo "############################################################"
          echo "TOTAL SOLVED: $TOTAL_SOLVED / $TASK_NUM"
          echo "############################################################"
          echo "$TOTAL_SOLVED" > /tmp/solved_count.txt
          echo "$TASK_NUM" > /tmp/total_count.txt

      - name: 9. Final summary (verbose)
        if: always()
        run: |
          set -x
          echo "############################################################"
          echo "##### 9. FINAL SUMMARY ####################################"
          echo "############################################################"
          echo "Solved: $(cat /tmp/solved_count.txt 2>/dev/null || echo 0)"
          echo "Total:  $(cat /tmp/total_count.txt 2>/dev/null || echo 0)"
          echo "--- all result.json ---"
          find /tmp/results -name result.json 2>/dev/null | sort | while read f; do
            echo "=== $f ==="
            cat "$f" || true
            echo
          done
          echo "--- full directory tree ---"
          find /tmp/results -type f 2>/dev/null | sort || true
          echo "--- pre_run.log (last 100 lines) ---"
          tail -100 /tmp/pre_run.log 2>/dev/null || true
          echo "##### END 9 #####"

      - name: 10. Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flag-probe-${{ github.run_id }}
          path: |
            /tmp/results
            /tmp/pre_run.log
            /tmp/secrets.sh
            /tmp/solved_count.txt
            /tmp/total_count.txt
          if-no-files-found: warn

      - name: 11. Fail if zero flags
        if: always()
        run: |
          set -x
          SOLVED=$(cat /tmp/solved_count.txt 2>/dev/null || echo 0)
          TOTAL=$(cat /tmp/total_count.txt 2>/dev/null || echo 0)
          echo "Final score: $SOLVED / $TOTAL"
          if [[ "$SOLVED" -gt 0 ]]; then
            echo "SUCCESS — at least one flag captured"
            exit 0
          else
            echo "::error::No flag captured"
            exit 1
          fi
