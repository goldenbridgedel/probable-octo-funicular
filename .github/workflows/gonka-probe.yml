name: Ultra-Verbose Top-3 Validation (GLM-5.3-Flash) — OpenAI style

on:
  workflow_dispatch:
    inputs:
      max_budget_usd:
        description: "Per-task dollar budget"
        required: false
        default: "4.0"
      timeout_seconds:
        description: "Per-task timeout (seconds)"
        required: false
        default: "9000"

permissions:
  contents: write   # needed to push logs back to the repo

jobs:
  ultra-verbose-top3:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      OPENAI_API_KEY: ${{ secrets.GONKA_API_KEY }}
      OPENAI_BASE_URL: "https://api.gonkarouter.io/v1"
      MODEL: "zai-org/GLM-5.3-Flash"
      OPENAI_LOG: "debug"
      PYTHONUNBUFFERED: "1"
      PYTHONLOGLEVEL: "DEBUG"
      UV_LOG: "debug"
      UV_VERBOSE: "1"
      DOCKER_BUILDKIT: "1"
      DOCKER_CLI_DEBUG: "1"

    steps:
      - name: 0. System info (ultra)
        run: |
          set -x
          echo "############################################################"
          echo "##### HOST INSPECTION"
          echo "############################################################"
          date -u
          uname -a
          cat /etc/os-release || true
          nproc
          lscpu || true
          free -h
          df -h
          lsblk || true
          docker version || true
          docker info || true
          env | sort | grep -E '^(PATH|HOME|GITHUB_|RUNNER_|OPENAI_|MODEL|UV_|PYTHON|DOCKER|CYBERGYM)' || true
          sysctl kernel.randomize_va_space 2>/dev/null || true
          sysctl kernel.core_pattern 2>/dev/null || true

      - name: 1. Checkout this repo (for pushing logs later)
        uses: actions/checkout@v4
        with:
          path: probe-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 1b. Checkout ExploitGym
        uses: actions/checkout@v4
        with:
          repository: sunblaze-ucb/exploitgym
          path: exploitgym

      - name: 2. Set up Python + uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -x
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          uv --version
          python3 --version

      - name: 3. Install dependencies (verbose)
        working-directory: exploitgym
        run: |
          set -x
          uv sync --extra proxy -v 2>&1 | tee /tmp/uv_sync.log
          uv pip install openai -v 2>&1 | tee /tmp/uv_pip_openai.log
          uv pip list 2>&1 | tee /tmp/uv_pip_list.log
          .venv/bin/python -c "import openai, sys; print('openai', openai.__version__); print(sys.executable)"

      - name: 4. Create top-3 task list
        working-directory: exploitgym
        run: |
          set -x
          mkdir -p data/task_ids
          cat > data/task_ids/top3_easy.txt << 'EOF'
          user:cybergym/arvo_44034
          user:cybergym/arvo_66627
          user:cybergym/arvo_50683
          EOF
          cat -n data/task_ids/top3_easy.txt

      - name: 5. Pull Docker images (ultra)
        working-directory: exploitgym
        run: |
          set -x
          docker images
          df -h
          uv run -v scripts/setup/pull_images.py data/task_ids/top3_easy.txt --user-modes exp.none 2>&1 | tee /tmp/pull_images.log || true
          docker images
          docker system df || true
          cat /tmp/pull_images.log || true

      - name: 6. Runtime artifacts
        working-directory: exploitgym
        run: |
          set -x
          bash -x scripts/setup/setup_data.sh 2>&1 | tee /tmp/setup_data.log || true
          docker pull ubuntu/squid:latest 2>&1 | tee /tmp/squid.log || true
          cat /tmp/setup_data.log || true

      - name: 7. Start controller / proxy (mint secrets)
        working-directory: exploitgym
        run: |
          set -x
          SALT="cg-$(openssl rand -hex 16)"
          FLAG_SEED="sf-$(openssl rand -hex 16)"
          API_KEY="cybergym-$(openssl rand -hex 16)"

          echo "CYBERGYM_SERVER_SALT=$SALT"           >> $GITHUB_ENV
          echo "CYBERGYM_SERVER_FLAG_SEED=$FLAG_SEED" >> $GITHUB_ENV
          echo "CYBERGYM_SERVER_API_KEY=$API_KEY"     >> $GITHUB_ENV

          export CYBERGYM_SERVER_SALT="$SALT"
          export CYBERGYM_SERVER_FLAG_SEED="$FLAG_SEED"
          export CYBERGYM_SERVER_API_KEY="$API_KEY"

          echo "===== MINTED SECRETS ====="
          echo "CYBERGYM_SERVER_SALT=$SALT"
          echo "CYBERGYM_SERVER_FLAG_SEED=$FLAG_SEED"
          echo "CYBERGYM_SERVER_API_KEY=$API_KEY"

          uv run -v scripts/setup/pre_run.py data/task_ids/top3_easy.txt 2>&1 | tee /tmp/pre_run.log || true
          echo "===== PRE_RUN FULL LOG ====="
          cat /tmp/pre_run.log || true
          echo "===== docker ps / ports ====="
          docker ps -a || true
          ss -tlnp || true

      - name: 8. Run agent = codex (OpenAI style, max verbosity)
        working-directory: exploitgym
        run: |
          set -x
          mkdir -p out/codex
          echo "############################################################"
          echo "##### CODEX / OPENAI-STYLE RUN"
          echo "############################################################"
          echo "date: $(date -u)"
          echo "OPENAI_API_KEY set? ${OPENAI_API_KEY:+yes (len=${#OPENAI_API_KEY})}"
          echo "OPENAI_BASE_URL=$OPENAI_BASE_URL"
          echo "MODEL=$MODEL"
          echo "CYBERGYM_SERVER_SALT set? ${CYBERGYM_SERVER_SALT:+yes}"
          echo "CYBERGYM_SERVER_FLAG_SEED set? ${CYBERGYM_SERVER_FLAG_SEED:+yes}"
          echo "CYBERGYM_SERVER_API_KEY set? ${CYBERGYM_SERVER_API_KEY:+yes}"
          cat -n data/task_ids/top3_easy.txt
          docker ps -a || true
          ss -tlnp || true

          # Quick live smoke test against Gonka (OpenAI style)
          echo "===== GONKA SMOKE TEST ====="
          .venv/bin/python - <<'PY' 2>&1 | tee /tmp/gonka_smoke.log || true
          import os, json
          from openai import OpenAI
          client = OpenAI(
              api_key=os.environ["OPENAI_API_KEY"],
              base_url=os.environ["OPENAI_BASE_URL"],
          )
          print("base_url =", client.base_url)
          try:
              models = client.models.list()
              print("models.list OK, count =", len(getattr(models, "data", []) or []))
              for m in (models.data or [])[:10]:
                  print(" -", getattr(m, "id", m))
          except Exception as e:
              print("models.list FAILED:", type(e), e)
          try:
              r = client.chat.completions.create(
                  model=os.environ["MODEL"],
                  messages=[{"role": "user", "content": "Reply with exactly: pong"}],
                  max_tokens=32,
              )
              print("chat OK:", r.choices[0].message.content)
          except Exception as e:
              print("chat FAILED:", type(e), e)
          PY

          uv run -v examples/run_agent.py \
            --agent codex \
            --model "$MODEL" \
            --tasks-file data/task_ids/top3_easy.txt \
            --max-workers 1 \
            --timeout ${{ github.event.inputs.timeout_seconds || 9000 }} \
            --budget ${{ github.event.inputs.max_budget_usd || 4.0 }} \
            --out-dir out/codex \
            --user-mode exp.none \
            --use-api-key \
            2>&1 | tee out/codex/FULL_CONSOLE.log /tmp/codex_console.log

          echo "===== CODEX FINISHED (exit=${PIPESTATUS[0]}) ====="
          date -u
          docker ps -a || true
          du -sh out/codex || true
          find out/codex -type f -printf "%s\t%p\n" | sort -n || true

      - name: 9. Dump results (ultra)
        working-directory: exploitgym
        if: always()
        run: |
          set -x
          OUT=out/codex
          echo "############################################################"
          echo "##### COMPLETE FILE TREE"
          echo "############################################################"
          find "$OUT" -type f -printf "%p (%s bytes)\n" 2>/dev/null | sort || true

          echo ""
          echo "############################################################"
          echo "##### ALL result.json"
          echo "############################################################"
          find "$OUT" -name 'result.json' 2>/dev/null | while read f; do
            echo "--- $f ---"
            cat "$f"
            if jq -e '.score > 0' "$f" >/dev/null 2>&1; then
              echo "✅ SOLVED"
            else
              echo "❌ NOT SOLVED"
            fi
            echo ""
          done || true

          echo ""
          echo "############################################################"
          echo "##### FULL CONSOLE LOG"
          echo "############################################################"
          cat "$OUT/FULL_CONSOLE.log" 2>/dev/null || true

          echo ""
          echo "############################################################"
          echo "##### PRE_RUN + SMOKE + ERROR GREP"
          echo "############################################################"
          cat /tmp/pre_run.log 2>/dev/null || true
          cat /tmp/gonka_smoke.log 2>/dev/null || true
          grep -n -iE 'error|ValueError|auth|401|403|invalid|failed|traceback|exception' \
            "$OUT/FULL_CONSOLE.log" /tmp/codex_console.log /tmp/gonka_smoke.log /tmp/pre_run.log \
            2>/dev/null | head -100 || true

      - name: 10. Upload Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top3-codex-openai-logs
          path: |
            exploitgym/out/codex/
            /tmp/*.log
          retention-days: 14

      # Push logs into the repo on branch run-logs/<run_id> so they are publicly downloadable
      - name: 11. Push logs to repo (public branch)
        if: always()
        working-directory: probe-repo
        run: |
          set -x
          RUN_ID="${{ github.run_id }}"
          BRANCH="run-logs/${RUN_ID}"
          DEST="logs/${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Collect everything we care about
          mkdir -p "$DEST"
          cp -a ../exploitgym/out/codex/. "$DEST/" 2>/dev/null || true
          cp -a /tmp/*.log "$DEST/" 2>/dev/null || true

          # Small index for humans
          {
            echo "# Run ${RUN_ID}"
            echo
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Actor: ${{ github.actor }}"
            echo "- SHA: ${{ github.sha }}"
            echo "- UTC: $(date -u)"
            echo
            echo "## result.json summary"
            find "$DEST" -name result.json | while read f; do
              echo "### $f"
              echo '```json'
              cat "$f"
              echo '```'
            done
          } > "$DEST/README.md"

          git checkout -B "$BRANCH"
          git add -A
          git status
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "logs: run ${RUN_ID} (codex / OpenAI-style Gonka probe)"
            git push -u origin "$BRANCH" --force
            echo "Logs pushed to branch: $BRANCH"
            echo "Browse: https://github.com/${{ github.repository }}/tree/${BRANCH}"
            echo "Raw example: https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/logs/${RUN_ID}/FULL_CONSOLE.log"
          fi
