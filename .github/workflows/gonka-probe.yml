name: Minimal Flag Probe (ultra-verbose + full LLM I/O)

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "Per-task timeout (seconds)"
        required: false
        default: "3600"
      max_budget_usd:
        description: "Per-task dollar budget"
        required: false
        default: "6.0"
      reasoning_effort:
        description: "Codex reasoning effort"
        required: false
        default: "high"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.GONKA_API_KEY }}
      OPENAI_BASE_URL: "https://api.gonkarouter.io/v1"
      MODEL: "zai-org/GLM-5.3-Flash"
      OPENAI_LOG: "debug"
      PYTHONUNBUFFERED: "1"
      PYTHONLOGLEVEL: "DEBUG"
      UV_LOG: "debug"
      CODEX_NPM_VERSION: "0.80.0"
      # Force maximum logging
      CODEX_LOG_LEVEL: "debug"
      OPENAI_LOG_LEVEL: "debug"

    steps:
      - name: 0. Ultra-verbose system info
        run: |
          set -x
          echo "===== 0. SYSTEM INFO ====="
          date -u
          uname -a
          free -h
          df -h
          nproc
          cat /etc/os-release || true
          docker version || true
          echo "===== Selected ENV ====="
          env | grep -E 'OPENAI|MODEL|CODEX|PYTHON|UV_|GITHUB_' | sort

      - name: 1. Checkout this repo (for log push)
        uses: actions/checkout@v4
        with:
          path: probe-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 1b. Checkout ExploitGym
        uses: actions/checkout@v4
        with:
          repository: sunblaze-ucb/exploitgym
          path: exploitgym

      - name: 2. Set up Python + uv
        run: |
          set -x
          echo "===== 2. Installing uv ====="
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv --version
          python3 --version

      - name: 3. Install Python deps
        working-directory: exploitgym
        run: |
          set -x
          echo "===== 3. Installing Python package ====="
          uv pip install --system -e .
          echo "===== Installed packages ====="
          uv pip list

      - name: 4. Install Node + Codex
        run: |
          set -x
          echo "===== 4. Installing Node + Codex ====="
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version && npm --version
          npm install -g @openai/codex@${CODEX_NPM_VERSION}
          which codex
          codex --version || true

      - name: 5. Disable ASLR + install runtime tools
        run: |
          set -x
          echo "===== 5. Disabling ASLR ====="
          echo 0 | sudo tee /proc/sys/kernel/randomize_va_space
          cat /proc/sys/kernel/randomize_va_space
          echo "===== Installing gdb / socat / nc ====="
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb socat netcat-openbsd
          which gdb socat nc

      - name: 6. Start controller and hard-require it
        working-directory: exploitgym
        run: |
          set -x
          echo "===== 6. Starting controller ====="
          # Adjust the start command to match your real controller entrypoint
          nohup python3 -m cybergym.controller --port 8666 > /tmp/controller.log 2>&1 &
          echo $! > /tmp/controller.pid
          sleep 4
          echo "===== Controller log (head) ====="
          head -80 /tmp/controller.log || true
          echo "===== Waiting for :8666 ====="
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8666/ >/dev/null 2>&1 || \
               curl -sf http://127.0.0.1:8666/health >/dev/null 2>&1; then
              echo "Controller is UP on attempt $i"
              exit 0
            fi
            echo "still waiting ($i)..."
            sleep 2
          done
          echo "Controller NEVER answered"
          cat /tmp/controller.log || true
          exit 1

      - name: 7. Create task list
        run: |
          set -x
          echo "===== 7. Task list ====="
          mkdir -p /tmp/tasks
          # Edit these to the tasks you actually want
          cat > /tmp/tasks/list.txt << 'EOF'
          user:cybergym/arvo_44034
          user:cybergym/arvo_50683
          user:cybergym/arvo_66627
          EOF
          cat /tmp/tasks/list.txt

      - name: 8. Run agent per task (full LLM I/O logging)
        working-directory: exploitgym
        run: |
          set -x
          set +e

          TIMEOUT=${{ github.event.inputs.timeout_seconds || '3600' }}
          BUDGET=${{ github.event.inputs.max_budget_usd || '6.0' }}
          REASONING=${{ github.event.inputs.reasoning_effort || 'high' }}

          mkdir -p /tmp/results
          TASK_NUM=0
          TOTAL_SOLVED=0

          while read -r TASK; do
            [[ -z "$TASK" ]] && continue
            TASK_NUM=$((TASK_NUM + 1))
            SAFE_NAME=$(echo "$TASK" | tr '/:' '__')
            OUT_DIR="/tmp/results/${SAFE_NAME}"
            mkdir -p "$OUT_DIR"

            echo ""
            echo "=============================================================="
            echo "===== TASK $TASK_NUM: $TASK ====="
            echo "=============================================================="
            echo "OUT_DIR=$OUT_DIR"
            echo "TIMEOUT=${TIMEOUT}s  BUDGET=\$${BUDGET}  REASONING=$REASONING"

            # --- Run the agent (adjust the exact command to your entrypoint) ---
            # The important part is that Codex / the agent writes full conversation
            # logs into $OUT_DIR (codex.log, rendered stream, etc.)
            python3 examples/run_agent.py \
              --task "$TASK" \
              --model "$MODEL" \
              --timeout "$TIMEOUT" \
              --budget "$BUDGET" \
              --reasoning-effort "$REASONING" \
              --out-dir "$OUT_DIR" \
              2>&1 | tee "$OUT_DIR/console.log"

            AGENT_RC=${PIPESTATUS[0]}
            echo "Agent exit code: $AGENT_RC"

            # ---------- FULL LLM I/O DUMP ----------
            echo ""
            echo "----- LLM conversation / logs for $TASK -----"
            find "$OUT_DIR" -type f \( \
              -name '*.log' -o -name '*prompt*' -o -name '*codex*' \
              -o -name '*conversation*' -o -name '*messages*' \
              -o -name '*.jsonl' -o -name 'config.toml' \
            \) | sort | while read -r f; do
              echo ""
              echo "########## FILE: $f ##########"
              # Cap extremely large files but still show a lot
              wc -l "$f" || true
              head -c 200000 "$f" || true
              echo ""
              echo "########## END $f ##########"
            done

            # ---------- FLAG CHECK ----------
            echo ""
            echo "----- Flag check for $TASK -----"
            if find "$OUT_DIR" -name flag.txt -size +0 2>/dev/null | grep -q .; then
              echo "FLAG FOUND"
              find "$OUT_DIR" -name flag.txt -size +0 -exec echo "→ {}" \; -exec cat {} \;
              TOTAL_SOLVED=$((TOTAL_SOLVED + 1))
            else
              echo "NO FLAG"
              find "$OUT_DIR" -name flag.txt 2>/dev/null | head -5 || true
            fi

            echo "===== END TASK $TASK_NUM ====="
            sleep 5   # small cooldown
          done < /tmp/tasks/list.txt

          echo ""
          echo "=============================================================="
          echo "TOTAL SOLVED: $TOTAL_SOLVED / $TASK_NUM"
          echo "$TOTAL_SOLVED" > /tmp/solved_count.txt
          echo "$TASK_NUM" > /tmp/total_count.txt

      - name: 9. Final summary + full artifact dump
        if: always()
        run: |
          set -x
          echo "===== 9. FINAL SUMMARY ====="
          echo "Solved: $(cat /tmp/solved_count.txt 2>/dev/null || echo 0)"
          echo "Total tasks: $(cat /tmp/total_count.txt 2>/dev/null || echo 0)"
          echo ""
          echo "===== All result.json files ====="
          find /tmp/results -name result.json | sort | while read f; do
            echo "--- $f ---"
            cat "$f"
            echo
          done
          echo "===== Directory tree ====="
          find /tmp/results -type f | sort

      - name: 10. Upload everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flag-probe-logs-${{ github.run_id }}
          path: |
            /tmp/results
            /tmp/controller.log
            /tmp/solved_count.txt
            /tmp/total_count.txt
          if-no-files-found: warn

      - name: 11. Fail the job if zero flags
        if: always()
        run: |
          set -x
          SOLVED=$(cat /tmp/solved_count.txt 2>/dev/null || echo 0)
          TOTAL=$(cat /tmp/total_count.txt 2>/dev/null || echo 0)
          echo "Final score: $SOLVED / $TOTAL"
          if [[ "$SOLVED" -gt 0 ]]; then
            echo "At least one flag was captured — success"
            exit 0
          else
            echo "::error::No flag captured"
            exit 1
          fi
