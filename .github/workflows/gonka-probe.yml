name: Ultra-Verbose Top-3 Validation (GLM-5.3-Flash)

on:
  workflow_dispatch:
    inputs:
      max_budget_usd:
        description: "Per-task dollar budget"
        required: false
        default: "4.0"
      timeout_seconds:
        description: "Per-task timeout (seconds)"
        required: false
        default: "9000"

jobs:
  ultra-verbose-top3:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      OPENAI_API_KEY: ${{ secrets.GONKA_API_KEY }}
      OPENAI_BASE_URL: "https://api.gonkarouter.io/v1"
      MODEL: "zai-org/GLM-5.3-Flash"
      # Force extreme logging everywhere
      OPENAI_LOG: "debug"
      PYTHONUNBUFFERED: "1"
      PYTHONLOGLEVEL: "DEBUG"
      UV_LOG: "debug"
      DOCKER_BUILDKIT: "1"

    steps:
      - name: 0. System info & disk space
        run: |
          echo "===== RUNNER INFO ====="
          uname -a
          free -h
          df -h
          nproc
          docker version || true
          echo "========================"

      - name: 1. Checkout ExploitGym
        uses: actions/checkout@v4
        with:
          repository: sunblaze-ucb/exploitgym
          path: exploitgym

      - name: 2. Set up Python + uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 3. Install dependencies (verbose)
        working-directory: exploitgym
        run: |
          set -x
          uv sync --extra proxy -v
          uv pip install openai -v
          echo "Installed packages:"
          uv pip list

      - name: 4. Create top-3 task list
        working-directory: exploitgym
        run: |
          mkdir -p data/task_ids
          cat > data/task_ids/top3_easy.txt << 'EOF'
          user:cybergym/arvo_44034
          user:cybergym/arvo_66627
          user:cybergym/arvo_50683
          EOF
          echo "===== TASK LIST ====="
          cat -n data/task_ids/top3_easy.txt
          echo "====================="

      - name: 5. Pull Docker images (ultra verbose)
        working-directory: exploitgym
        run: |
          set -x
          echo "===== BEFORE IMAGE PULL ====="
          docker images
          df -h
          echo "Pulling images for top-3 (exp.none)..."
          uv run -v scripts/setup/pull_images.py data/task_ids/top3_easy.txt --user-modes exp.none 2>&1 | tee /tmp/pull_images.log || true
          echo "===== AFTER IMAGE PULL ====="
          docker images
          df -h
          echo "===== PULL LOG (last 100 lines) ====="
          tail -n 100 /tmp/pull_images.log || true

      - name: 6. Runtime artifacts (best-effort, verbose)
        working-directory: exploitgym
        run: |
          set -x
          bash -x scripts/setup/setup_data.sh 2>&1 | tee /tmp/setup_data.log || true
          docker pull ubuntu/squid:latest 2>&1 | tee /tmp/squid.log || true
          echo "===== SETUP_DATA LOG (last 80 lines) ====="
          tail -n 80 /tmp/setup_data.log || true

      - name: 7. Start controller / proxy (verbose)
        working-directory: exploitgym
        run: |
          set -x
          uv run -v scripts/setup/pre_run.py data/task_ids/top3_easy.txt 2>&1 | tee /tmp/pre_run.log || true
          echo "===== PRE_RUN FULL LOG ====="
          cat /tmp/pre_run.log || true
          echo "===== ENVIRONMENT AFTER PRE_RUN ====="
          env | grep -E 'CYBERGYM_|DOCKER_|OPENAI_|MODEL' || true

      - name: 8. Run agent with maximum verbosity
        working-directory: exploitgym
        run: |
          set -x
          mkdir -p out/top3_ultra_verbose
          echo "===== STARTING AGENT RUN ====="
          echo "Model: $MODEL"
          echo "Base URL: $OPENAI_BASE_URL"
          echo "Tasks:"
          cat data/task_ids/top3_easy.txt
          echo "=============================="

          # Run agent and capture EVERYTHING
          # --use-api-key is required so run_agent.py accepts OPENAI_API_KEY / OPENAI_BASE_URL
          uv run -v examples/run_agent.py \
            --agent claude_code \
            --model "$MODEL" \
            --tasks-file data/task_ids/top3_easy.txt \
            --max-workers 1 \
            --timeout ${{ github.event.inputs.timeout_seconds || 9000 }} \
            --budget ${{ github.event.inputs.max_budget_usd || 4.0 }} \
            --out-dir out/top3_ultra_verbose \
            --user-mode exp.none \
            --use-api-key \
            2>&1 | tee out/top3_ultra_verbose/FULL_CONSOLE.log

          echo "===== AGENT RUN FINISHED ====="

      - name: 9. Dump every file produced (ultra detailed)
        working-directory: exploitgym
        if: always()
        run: |
          set -x
          OUT=out/top3_ultra_verbose

          echo "############################################################"
          echo "##### COMPLETE FILE TREE"
          echo "############################################################"
          find "$OUT" -type f -printf "%p (%s bytes)\n" | sort

          echo ""
          echo "############################################################"
          echo "##### ALL result.json FILES"
          echo "############################################################"
          find "$OUT" -name 'result.json' | while read f; do
            echo "---------- $f ----------"
            cat "$f"
            echo ""
          done

          echo ""
          echo "############################################################"
          echo "##### ALL TRAJECTORY / CONVERSATION FILES"
          echo "############################################################"
          find "$OUT" -type f \( -name '*.json' -o -name '*.jsonl' -o -name '*traj*' -o -name '*conversation*' -o -name '*history*' \) | while read f; do
            echo "========== FILE: $f =========="
            # Print first 300 lines to avoid exploding the log
            head -n 300 "$f"
            echo "... (truncated if longer) ..."
            echo ""
          done

          echo ""
          echo "############################################################"
          echo "##### LAST 300 LINES OF FULL CONSOLE LOG"
          echo "############################################################"
          tail -n 300 "$OUT/FULL_CONSOLE.log" || true

          echo ""
          echo "############################################################"
          echo "##### SUCCESS CHECK"
          echo "############################################################"
          find "$OUT" -name result.json -print0 | while IFS= read -r -d '' f; do
            if jq -e '.score > 0' "$f" >/dev/null 2>&1; then
              echo "✅ SOLVED: $f"
              jq . "$f"
            else
              echo "❌ NOT SOLVED: $f"
            fi
          done || true

      - name: 10. Upload everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top3-ultra-verbose-logs
          path: |
            exploitgym/out/top3_ultra_verbose/
            /tmp/*.log
          retention-days: 14
